name: Factory workflow

on:
  workflow_dispatch:
  push:
    branches: ['main']

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: TheFactory/ClientApp/package-lock.json

      - name: Install Angular dependencies
        working-directory: TheFactory/ClientApp
        run: npm ci

      - name: Build Angular app
        working-directory: TheFactory/ClientApp
        run: npm run build -- --configuration production

      - name: Copy Angular build to wwwroot
        run: |
          rm -rf TheFactory/wwwroot/*
          cp -r TheFactory/ClientApp/dist/* TheFactory/wwwroot/

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Dependencies
        run: dotnet restore

      - id: build
        name: Build
        run: dotnet build ./TheFactory/TheFactory.csproj --no-restore

      - id: publish
        name: Publish
        run: dotnet publish ./TheFactory/TheFactory.csproj -c Release -r linux-x64 --self-contained false -o ./publish

      - name: Zip Artifact
        run: cd publish && zip -r ../TheFactory.zip .

      - name: List zip contents
        run: unzip -l TheFactory.zip

      - id: upload
        name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-webapp
          path: TheFactory.zip

      - name: List files before deploy
        run: ls -l

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-webapp
          path: ./artifact

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - name: Verify Azure context
        run: |
          if [ -z "${{ secrets.AZURE_CLIENT_ID }}" ] || [ -z "${{ secrets.AZURE_TENANT_ID }}" ] || [ -z "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ]; then
            echo "::error::Missing one or more required secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID."
            exit 1
          fi

          echo "Authenticated account details:"
          az account show --query "{tenantId:tenantId,user:user.name}" -o table || true

          echo "Visible subscriptions for this principal:"
          az account list --query "[].{name:name,id:id,state:state}" -o table || true

          if ! az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"; then
            echo "::error::OIDC login succeeded but this principal cannot access subscription '${{ secrets.AZURE_SUBSCRIPTION_ID }}'."
            echo "::error::Grant the App Registration/Service Principal an RBAC role (for example Contributor) at subscription or resource-group scope."
            echo "::error::Also confirm AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID belong to the same tenant as the federated credential."
            exit 1
          fi

          az account show --query "{name:name,id:id,tenantId:tenantId}" -o table

      - name: Resolve Web App resource group
        id: resolve-rg
        run: |
          APP_NAME="AzureLinuxAppService"
          RG_FROM_SECRET="${{ secrets.AZURE_RESOURCE_GROUP }}"

          if [ -n "$RG_FROM_SECRET" ]; then
            RG="$RG_FROM_SECRET"
          else
            RG=$(az webapp list --query "[?name=='${APP_NAME}'].resourceGroup | [0]" -o tsv)
          fi

          if [ -z "$RG" ]; then
            echo "::error::Could not determine resource group for app '${APP_NAME}'."
            echo "::error::Set AZURE_RESOURCE_GROUP secret or ensure the app exists in subscription '${{ secrets.AZURE_SUBSCRIPTION_ID }}'."
            exit 1
          fi

          if ! az webapp show --name "$APP_NAME" --resource-group "$RG" --query "{name:name,resourceGroup:resourceGroup,state:state}" -o table; then
            echo "::error::Web App '${APP_NAME}' was not found in resource group '${RG}'."
            exit 1
          fi

          echo "resource_group=$RG" >> "$GITHUB_OUTPUT"

      - name: Deploy To Azure (zip deploy)
        run: |
          az webapp deployment source config-zip \
            --resource-group "${{ steps.resolve-rg.outputs.resource_group }}" \
            --name "AzureLinuxAppService" \
            --src "./artifact/TheFactory.zip"
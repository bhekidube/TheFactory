

<section class="learning-page">
  <app-logout-link></app-logout-link>

  <div class="learning-header">
    <h2>School</h2>
    <p *ngIf="!loading && schoolName">{{ schoolName }}</p>
    <p *ngIf="!loading && !schoolName && !errorMessage">No school selected.</p>
    <a [routerLink]="['/learning']">Back to Learning</a>
  </div>

  <nav class="school-nav" *ngIf="!loading && schoolName" aria-label="School learning navigation">
    <a
      class="school-nav-link"
      [routerLink]="['/learning/schools', schoolId, 'learners']"
      [routerLinkActive]="['is-active']">
      Learners
    </a>
    <a
      class="school-nav-link"
      [routerLink]="['/learning/schools', schoolId, 'reports']"
      [routerLinkActive]="['is-active']">
      Reports
    </a>
    <a
      class="school-nav-link"
      [routerLink]="['/school/admin/learners']"
      [routerLinkActive]="['is-active']">
      Full Learner Admin
    </a>
  </nav>

  <div class="state-card" *ngIf="loading">Loading school context...</div>
  <div class="message error" *ngIf="!loading && errorMessage">{{ errorMessage }}</div>

  <div class="state-card" *ngIf="!loading && schoolName">
    <p><strong>Selected school:</strong> {{ schoolName }}</p>
    <p><strong>Schools available:</strong> {{ schoolsCount }}</p>
    <p><strong>Learner records available:</strong> {{ learnersCount }}</p>
  </div>

  <app-learner-management *ngIf="!loading && schoolName"></app-learner-management>
</section>

<h1 id="tableLabel">Weather forecast</h1>

<p>This component demonstrates fetching data from the server.</p>

<p *ngIf="!forecasts"><em>Loading...</em></p>

<table class='table table-striped' aria-labelledby="tableLabel" *ngIf="forecasts">
  <thead>
    <tr>
      <th class="sortable-header" [attr.aria-sort]="tableSort.getAriaSort('date')">
        <button type="button" class="table-sort-button" (click)="tableSort.sortGrid('date')">Date <span class="sort-indicator" aria-hidden="true">{{ tableSort.getSortIndicator('date') }}</span></button>
      </th>
      <th class="sortable-header" [attr.aria-sort]="tableSort.getAriaSort('temperatureC')">
        <button type="button" class="table-sort-button" (click)="tableSort.sortGrid('temperatureC')">Temp. (C) <span class="sort-indicator" aria-hidden="true">{{ tableSort.getSortIndicator('temperatureC') }}</span></button>
      </th>
      <th class="sortable-header" [attr.aria-sort]="tableSort.getAriaSort('temperatureF')">
        <button type="button" class="table-sort-button" (click)="tableSort.sortGrid('temperatureF')">Temp. (F) <span class="sort-indicator" aria-hidden="true">{{ tableSort.getSortIndicator('temperatureF') }}</span></button>
      </th>
      <th class="sortable-header" [attr.aria-sort]="tableSort.getAriaSort('summary')">
        <button type="button" class="table-sort-button" (click)="tableSort.sortGrid('summary')">Summary <span class="sort-indicator" aria-hidden="true">{{ tableSort.getSortIndicator('summary') }}</span></button>
      </th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let forecast of forecasts | tableSort: tableSort.sortColumn:tableSort.sortDirection">
      <td>{{ forecast.date }}</td>
      <td>{{ forecast.temperatureC }}</td>
      <td>{{ forecast.temperatureF }}</td>
      <td>{{ forecast.summary }}</td>
    </tr>
  </tbody>
</table>

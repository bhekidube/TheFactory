<section class="reset-password-container">
  <h2>Reset your password</h2>

  <ng-container *ngIf="isComplete; else resetFormContent">
    <p class="success-message" role="status" aria-live="polite">
      Your password has been reset successfully.
    </p>
    <a class="back-link" routerLink="/auth">Return to login</a>
  </ng-container>

  <ng-template #resetFormContent>
    <p class="instructions">Choose a new password for your account.</p>

    <form
      *ngIf="email && token"
      #passwordForm="ngForm"
      (ngSubmit)="resetPassword()"
      novalidate>
      <label for="newPassword">New password</label>
      <input
        id="newPassword"
        type="password"
        name="newPassword"
        [(ngModel)]="newPassword"
        autocomplete="new-password"
        required
        minlength="8"
        maxlength="256"
        [disabled]="isLoading"
        #password="ngModel"
        [attr.aria-describedby]="password.invalid && password.touched ? 'password-error' : null" />
      <div
        *ngIf="password.invalid && password.touched"
        class="validation-error"
        id="password-error">
        Password must be between 8 and 256 characters.
      </div>

      <label for="confirmPassword">Confirm new password</label>
      <input
        id="confirmPassword"
        type="password"
        name="confirmPassword"
        [(ngModel)]="confirmPassword"
        autocomplete="new-password"
        required
        [disabled]="isLoading"
        #confirmation="ngModel" />
      <div
        *ngIf="confirmation.touched && confirmPassword !== newPassword"
        class="validation-error">
        Passwords do not match.
      </div>

      <button
        type="submit"
        class="submit-button"
        [disabled]="passwordForm.invalid || newPassword !== confirmPassword || isLoading">
        {{ isLoading ? 'Updating…' : 'Reset password' }}
      </button>
    </form>

    <p *ngIf="errorMessage" class="error-message" role="alert">
      {{ errorMessage }}
    </p>

    <a *ngIf="!email || !token" class="back-link" routerLink="/forgot-password">
      Request a new reset link
    </a>
    <a class="back-link" routerLink="/auth">Back to login</a>
  </ng-template>
</section>

<div class="auth-container">
  <h2>Log into Hambaonline</h2>

  <section class="social-login" aria-label="Social sign-in options">
    <button type="button" class="google-btn" (click)="continueWithGoogle()" aria-label="Continue with Google">
      <span class="google-mark" aria-hidden="true">G</span>
      Continue with Google
    </button>
  </section>

  <div class="auth-divider" role="separator"><span>OR</span></div>

  <form #loginForm="ngForm" (ngSubmit)="login()" novalidate>
    <label for="loginEmail">Email</label>
    <input
      id="loginEmail"
      type="email"
      [(ngModel)]="loginModel.email"
      name="loginEmail"
      placeholder="you@example.com"
      autocomplete="email"
      [pattern]="emailPattern"
      required
      #loginEmail="ngModel" />
    <div *ngIf="(loginEmail.touched || loginSubmitted) && !isLoginEmailValid()" class="error" id="login-email-error">
      Enter a valid email address without consecutive dots.
    </div>

    <label for="loginPassword">Password</label>
    <div class="password-field">
      <input
        id="loginPassword"
        [type]="loginPasswordVisible ? 'text' : 'password'"
        [(ngModel)]="loginModel.password"
        name="loginPassword"
        placeholder="Password"
        autocomplete="current-password"
        required
        minlength="6"
        [attr.aria-describedby]="loginPassword.invalid && (loginPassword.touched || loginSubmitted) ? 'login-password-error' : null"
        #loginPassword="ngModel" />
      <button
        type="button"
        class="password-toggle"
        (click)="toggleLoginPassword()"
        [attr.aria-label]="loginPasswordVisible ? 'Hide password' : 'Show password'"
        [attr.aria-pressed]="loginPasswordVisible">
        <span class="eye-icon" aria-hidden="true"></span>
        <span class="sr-only">{{ loginPasswordVisible ? 'Hide password' : 'Show password' }}</span>
      </button>
    </div>
    <div *ngIf="loginPassword.invalid && (loginPassword.touched || loginSubmitted)" class="error" id="login-password-error">
      Password is required (min 6 chars).
    </div>
    <button type="submit" class="login-btn" [disabled]="loginForm.invalid || !isLoginEmailValid()">Log in</button>
  </form>

  <button type="button" class="guest-btn" (click)="continueAsGuest()" aria-label="Continue as guest">Continue as Guest</button>

  <div class="auth-actions">
    <a class="forgot-password" (click)="forgotPassword()">Forgot password?</a>
    <button type="button" (click)="toggleRegister()" [ngClass]="showRegister ? 'close-btn' : 'subscribe-btn'">
      {{ showRegister ? 'Don\'t create account' : 'Create new account' }}
    </button>
  </div>

  <div *ngIf="showRegister">
    <h2>Join Hamba</h2>
    <form #registerForm="ngForm" (ngSubmit)="register()" novalidate>
      <input type="text" [(ngModel)]="registerModel.name" name="registerName" placeholder="Name" required #registerName="ngModel" />
      <div *ngIf="registerName.invalid && registerName.touched" class="error">Name is required.</div>
      <input type="email" [(ngModel)]="registerModel.email" name="registerEmail" placeholder="Email" required #registerEmail="ngModel" />
      <div *ngIf="registerEmail.invalid && registerEmail.touched" class="error">Valid email is required.</div>
      <input type="text" [(ngModel)]="registerModel.cellPhoneNo" name="registerCellPhoneNo" placeholder="Cell Phone" />
      <input type="text" [(ngModel)]="registerModel.alternateCellPhoneNo" name="registerAlternateCellPhoneNo" placeholder="Alternate Cell Phone" />

      <!-- Operator Dropdown -->
      <select [(ngModel)]="registerModel.operatorId" name="registerOperatorId" required #registerOperatorId="ngModel">
        <option value="" disabled selected>Select Operator</option>
        <option *ngFor="let operator of operators" [value]="operator.operatorId">{{ operator.name }}</option>
      </select>
      <div *ngIf="registerOperatorId.invalid && registerOperatorId.touched" class="error">Operator is required.</div>

      <div class="password-field">
        <input [type]="registerPasswordVisible ? 'text' : 'password'" [(ngModel)]="registerModel.password" name="registerPassword" placeholder="Password" autocomplete="new-password" required minlength="6" #registerPassword="ngModel" />
        <button type="button" class="password-toggle" (click)="toggleRegisterPassword()" [attr.aria-label]="registerPasswordVisible ? 'Hide password' : 'Show password'" [attr.aria-pressed]="registerPasswordVisible">
          <span class="eye-icon" aria-hidden="true"></span>
          <span class="sr-only">{{ registerPasswordVisible ? 'Hide password' : 'Show password' }}</span>
        </button>
      </div>
      <div *ngIf="registerPassword.invalid && registerPassword.touched" class="error">Password is required (min 6 chars).</div>
      <button type="submit" [disabled]="registerForm.invalid" class="subscribe-btn">Join Hamba</button>
    </form>
  </div>

  <div *ngIf="error" class="error auth-error">{{ error }}</div>
</div>

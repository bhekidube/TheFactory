<header class="header-banner">
  <div class="header-brand">
    <h1><img class="header-brand-logo" src="assets/hamba-online-logo.svg" alt="HambaOnline"></h1>
   <!-- <p *ngIf="showTransportTagline">Plug yama bhasi</p> -->
  </div>
  <nav class="hamba-nav" aria-label="HambaOnline navigation">
    <a
      class="hamba-nav-link"
      [routerLink]="['/']"
      [routerLinkActive]="['is-active']"
      [routerLinkActiveOptions]="{ exact: true }">
      Transport
    </a>
    <a
      *ngIf="canAccessLearning"
      class="hamba-nav-link"
      [routerLink]="['/learning']"
      [routerLinkActive]="['is-active']">
      Learning
    </a>
    <span *ngIf="signedInUserName" class="signed-in-status" role="status">
      Logged in as <strong>{{ signedInUserName }}</strong>
    </span>
  </nav>
</header>

<router-outlet></router-outlet>
<footer class="site-footer">
  <span class="footer-copyright">&copy; {{ currentYear }} HambaOnline. All rights reserved.</span>
  <nav class="footer-social-links" aria-label="HambaOnline social media">
    <a
      href="https://www.facebook.com/profile.php?id=61577895707425"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="HambaOnline on Facebook">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M13.5 21v-8.2h2.8l.4-3.2h-3.2V7.5c0-.9.3-1.6 1.6-1.6H17V3.1c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3v2.4H7.5v3.2h2.8V21h3.2z" />
      </svg>
    </a>
    <a
      href="https://www.instagram.com/app.hambaonline/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="HambaOnline on Instagram">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <rect x="3.5" y="3.5" width="17" height="17" rx="5" />
        <circle cx="12" cy="12" r="4" />
        <circle class="instagram-icon-dot" cx="17.6" cy="6.7" r="1" />
      </svg>
    </a>
  </nav>
</footer>

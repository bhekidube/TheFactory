<section class="forgot-password-container">
  <h2>Forgot your password?</h2>
  <p class="instructions">Enter the email address associated with your account and we’ll send you a reset link.</p>

  <form #resetForm="ngForm" (ngSubmit)="requestReset()" novalidate>
    <label for="resetEmail">Email</label>
    <input
      id="resetEmail"
      type="email"
      name="email"
      [(ngModel)]="email"
      placeholder="you@example.com"
      autocomplete="email"
      email
      required
      maxlength="100"
      [disabled]="isLoading"
      #resetEmail="ngModel"
      [attr.aria-describedby]="resetEmail.invalid && resetEmail.touched ? 'reset-email-error' : null" />

    <div
      *ngIf="resetEmail.invalid && resetEmail.touched"
      class="validation-error"
      id="reset-email-error">
      Enter a valid email address.
    </div>

    <button type="submit" class="submit-button" [disabled]="resetForm.invalid || isLoading">
      {{ isLoading ? 'Sending…' : 'Send reset link' }}
    </button>
  </form>

  <p *ngIf="successMessage" class="success-message" role="status" aria-live="polite">
    {{ successMessage }}
  </p>
  <p *ngIf="errorMessage" class="error-message" role="alert">
    {{ errorMessage }}
  </p>

  <a class="back-link" routerLink="/auth">Back to login</a>
</section>
